services:
  # Single Unified Web Service (Frontend + Backend on 1 Single URL)
  - type: web
    name: auralix-revenuehub
    env: python
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: auralix-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

databases:
  # Managed PostgreSQL Database
  - name: auralix-db
    databaseName: auralix_revenuehub
    user: auralix_user

